<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="DC Emlak — emlak danışmanları için hepsi bir arada çalışma alanı. Tıklanabilir arayüz prototipi.">
<title>DC Emlak Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e9ecf1; --border:#e2e5ea;
  --text:#131722; --text-2:#475061; --muted:#7a8394;
  --brand:#4338ca; --brand-hover:#3730a3; --brand-soft:#eef0ff; --brand-ink:#ffffff;
  --ok:#15803d; --ok-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fdf3e1; --err:#c02626; --err-bg:#fdecec; --info:#0369a1; --info-bg:#e5f1fa;
  --chart:#4f46e5; --chart-grid:#e8ebf0;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 16px 48px rgba(16,24,40,.22);
  --r:12px; --r-sm:8px; --gutter:24px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1016; --surface:#151921; --surface-2:#1b2029; --surface-3:#252b36; --border:#282f3b;
    --text:#e7eaf0; --text-2:#b1b8c4; --muted:#868fa0;
    --brand:#8b93ff; --brand-hover:#a5abff; --brand-soft:#22254a; --brand-ink:#0d1016;
    --ok:#4ade80; --ok-bg:#11271a; --warn:#fbbf24; --warn-bg:#2c2310; --err:#f87171; --err-bg:#301517; --info:#38bdf8; --info-bg:#0e2433;
    --chart:#8b93ff; --chart-grid:#252b36;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151921; --surface-2:#1b2029; --surface-3:#252b36; --border:#282f3b;
  --text:#e7eaf0; --text-2:#b1b8c4; --muted:#868fa0;
  --brand:#8b93ff; --brand-hover:#a5abff; --brand-soft:#22254a; --brand-ink:#0d1016;
  --ok:#4ade80; --ok-bg:#11271a; --warn:#fbbf24; --warn-bg:#2c2310; --err:#f87171; --err-bg:#301517; --info:#38bdf8; --info-bg:#0e2433;
  --chart:#8b93ff; --chart-grid:#252b36;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ============ Base ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .small{font-size:12px} .xs{font-size:11px}
.bold{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Shell ============ */
.proto-banner{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;text-align:center;padding:5px 16px;border-bottom:1px solid var(--border)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--text)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);font-weight:500;min-height:38px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--brand-soft);color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--text-2);padding:1px 7px;border-radius:99px}
.nav a.active .cnt{background:var(--brand);color:var(--brand-ink)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border)}
.me{display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.avatar.lg{width:44px;height:44px;font-size:15px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px var(--gutter);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .mlogo{display:none}
.search-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:0 10px;height:38px;color:var(--muted);min-width:260px;cursor:pointer}
.search-btn kbd{margin-left:auto}
kbd{font:11px/1 Inter,sans-serif;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--muted);background:var(--surface-2)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--err);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.content{padding:24px var(--gutter) 48px;width:100%;max-width:1320px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.foot{padding:16px var(--gutter);color:var(--muted);font-size:12px;text-align:center}

.tabbar{display:none}

/* ============ Components ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-b{padding:14px 16px}
.card-h h2{font-size:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.keep3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.kokpit-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.lg{height:44px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.call{background:var(--ok);border-color:var(--ok);color:#fff;min-width:64px}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.badge svg.i{width:13px;height:13px;stroke-width:2.2}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor;flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--text-2);white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--text-2);font-weight:500}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 10px;width:100%;min-width:0}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.input:focus,.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .input{width:auto}

.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > span{display:block;height:100%;border-radius:99px;background:var(--brand)}
.progress.ok > span{background:var(--ok)} .progress.warn > span{background:var(--warn)} .progress.err > span{background:var(--err)}

.kpi{padding:14px 16px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--ok)} .down{color:var(--err)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);min-height:56px}
.li:first-child{border-top:0}
.li .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.warn{background:var(--warn-bg);color:var(--warn)} .ic.err{background:var(--err-bg);color:var(--err)} .ic.info{background:var(--info-bg);color:var(--info)} .ic.brand{background:var(--brand-soft);color:var(--brand)}
.li .t{font-weight:600}
.li .s{font-size:12px;color:var(--muted)}
.li.link{cursor:pointer} .li.link:hover{background:var(--surface-2)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a.on{color:var(--brand);border-color:var(--brand)}
.tabs a:hover{color:var(--text)}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.kv > div{padding:10px 0;border-bottom:1px dashed var(--border);display:flex;justify-content:space-between;gap:10px;padding-right:16px}
.kv > div:nth-child(2n){padding-right:0;padding-left:16px}
.kv dt{color:var(--muted);font-size:12.5px} .kv dd{margin:0;font-weight:600;text-align:right}

/* responsive table -> cards */
.rtable{width:100%;border-collapse:collapse}
.rtable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.rtable td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
.rtable tbody tr:hover{background:var(--surface-2)}
.rtable .r{text-align:right}
.rtable td.r,.nw{white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.badge.wrap{white-space:normal;height:auto;min-height:22px;padding:3px 8px;line-height:1.3}

.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;font-weight:700;font-size:15px}
.score.hi{background:var(--err-bg);color:var(--err)}
.score.md{background:var(--warn-bg);color:var(--warn)}
.score.lo{background:var(--surface-3);color:var(--text-2)}

.heat{display:flex;align-items:center;gap:6px;min-width:90px}
.heat .progress{flex:1;height:6px}

/* photo placeholder */
.ph{height:100%;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2));color:rgba(255,255,255,.85);display:grid;place-items:center}
.ph svg{width:34%;height:34%;max-width:56px;stroke:rgba(255,255,255,.75);fill:none;stroke-width:1.4}
.ph .cap{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(0,0,0,.45);color:#fff;padding:2px 7px;border-radius:6px}
.ph .tag{position:absolute;right:8px;top:8px}

/* portfolio card grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.pcard:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--border))}
.pcard .ph{aspect-ratio:16/10;border-radius:0}
.pcard .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.price{font-weight:700;font-size:17px;letter-spacing:-.01em}

/* ring */
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px}
.ring .v small{display:block;font-size:10px;color:var(--muted);font-weight:500;text-align:center;margin-top:-4px}

/* portfolio detail */
.pd{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:260px}
.gallery .ph:first-child{grid-row:1/3}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.comp{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--border)}
.comp:first-child{border-top:0}
.comp .grow{font-weight:500}
.sugg{display:flex;gap:8px;padding:8px 0;font-size:13px}
.sugg svg{color:var(--warn);margin-top:1px}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:420px;scroll-snap-align:start}
.col-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.col-h .n{font-size:12px;color:var(--muted)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;transition:background .15s}
.col.over .col-b{background:var(--brand-soft)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .flags{display:flex;gap:4px;flex-wrap:wrap}

/* calendar */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day{flex:1;min-width:52px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.day b{display:block;font-size:17px}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.day.on span{color:inherit;opacity:.8}
.agenda{display:flex;flex-direction:column;gap:12px}
.appt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.appt .tm{font-weight:700;font-size:15px;padding-top:12px}
.appt .tm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.appt .card{border-left:3px solid var(--c,var(--border))}

/* chat */
.inbox{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:520px}
.inbox .conv-list{border-right:1px solid var(--border)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:360px}
.bubble{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.chart .lb{fill:var(--text-2);font-size:11.5px;font-family:Inter,sans-serif;font-weight:500}
.chart .gl{stroke:var(--chart-grid);stroke-width:1}
.chart .bar{fill:var(--chart)}
.chart .bar.dim{fill:color-mix(in srgb,var(--chart) 38%,var(--surface))}
.chart .bar:hover{opacity:.8}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;max-width:240px}
.tip.on{opacity:1}

/* toggle */
.switch{position:relative;width:40px;height:24px;flex:none;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
input[type=range]{width:100%;accent-color:var(--brand)}

/* plans */
.plan{padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.pop{border:2px solid var(--brand)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.plan li{display:flex;gap:6px}
.plan li svg{color:var(--ok)}
.plan .pr{font-size:26px;font-weight:700;letter-spacing:-.02em}

/* overlays */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,12,18,.45);display:flex;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{margin-left:auto;width:min(480px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(24px);transition:transform .2s}
.overlay.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sheet-h h2{flex:1}
.sheet-b{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sheet-b > *{flex-shrink:0}
.sheet-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.overlay.center{align-items:center;justify-content:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;transform:scale(.97);transition:transform .18s}
.overlay.on .modal{transform:none}
.modal.wide{width:min(720px,100%)}
.handle{display:none}

.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px}
.alert.err{background:var(--err-bg);color:var(--err)} .alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.info{background:var(--info-bg);color:var(--info)} .alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert .body{color:var(--text)}
.alert b{color:inherit}

.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:10px;padding:8px 0;position:relative}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-2);flex:none;z-index:1}
.step.done .n{background:var(--ok);color:#fff}
.step.cur .n{background:var(--brand);color:var(--brand-ink)}
.step:not(:last-child)::before{content:"";position:absolute;left:12.5px;top:30px;bottom:-6px;width:1px;background:var(--border)}

details.obj{border:1px solid var(--border);border-radius:10px;padding:0 12px}
details.obj summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.obj summary::-webkit-details-marker{display:none}
details.obj[open] summary{border-bottom:1px dashed var(--border)}
details.obj p{padding:10px 0;color:var(--text-2)}
.script{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--text-2);line-height:1.55}
.script b{color:var(--text)}

.otp{display:flex;gap:6px;justify-content:center}
.otp input{width:42px;height:50px;text-align:center;font-size:20px;font-weight:700;border:1px solid var(--border);border-radius:10px;background:var(--surface)}

.toast-wrap{position:fixed;z-index:300;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* command palette */
.cmdk{width:min(620px,100%);align-self:flex-start;margin-top:10vh}
.cmdk .in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.cmdk .in input{flex:1;border:0;background:transparent;height:54px;font-size:16px;outline:none;min-width:0}
.cmdk .res{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.cmdk .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.cmdk .it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.cmdk .it.sel{background:var(--brand-soft)}
.cmdk .it .s{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:13px}
.quick button .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.quick button:hover{border-color:var(--brand)}
.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.navgrid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:500;text-align:center}
.navgrid a.active{background:var(--brand-soft);color:var(--brand)}

.rec{width:92px;height:92px;border-radius:50%;background:var(--err);color:#fff;display:grid;place-items:center;margin:8px auto;animation:pulse 1.2s infinite}
.rec svg{width:36px;height:36px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--err) 50%,transparent)}100%{box-shadow:0 0 0 22px transparent}}

.doc{border:1px solid var(--border);border-radius:10px;padding:18px;background:var(--surface-2);font-size:13px;line-height:1.7}
.doc .f{background:var(--brand-soft);color:var(--brand);padding:1px 6px;border-radius:5px;font-weight:600}
.doc .f.miss{background:var(--err-bg);color:var(--err)}

/* ============ Mobile ============ */
@media (max-width:1100px){
  .kokpit-grid,.pd{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:768px){

  .tabbar{display:flex;position:fixed;z-index:40;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);background:none;border:0;padding:4px 0;min-height:44px;cursor:pointer}
  .tabbar .active{color:var(--brand)}
  .tabbar .plus{flex:none;width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:-22px 8px 0;box-shadow:var(--shadow-lg)}
  .tabbar .plus svg{width:26px;height:26px;stroke-width:2.4}
  .overlay:not(.center) .sheet{margin:auto 0 0;height:auto;max-height:88vh;width:100%;border-radius:18px 18px 0 0;transform:translateY(30px)}
  .overlay.on:not(.center) .sheet{transform:none}
  .handle{display:block;width:40px;height:4px;border-radius:9px;background:var(--surface-3);margin:8px auto 0}
  .sheet-b{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .cmdk{margin-top:4vh}
  .toast-wrap{bottom:92px}
  /* table -> cards */
  .rtable thead{display:none}
  .rtable,.rtable tbody{display:block}
  .rtable tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--border);align-items:center}
  .rtable td{padding:0;border:0;display:block}
  .rtable td[data-m="hide"]{display:none}
  .rtable td[data-m="full"]{grid-column:1/-1}
  .rtable td[data-m="sub"]{grid-column:2/3}
  .rtable td[data-l]::before{content:attr(data-l) " ";color:var(--muted);font-size:11px}
  .rtable .r{text-align:left}
  .appt{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .board{grid-auto-columns:minmax(236px,82%)}
  .hide-m{display:none!important}
  .li .t.ellipsis,h1.ellipsis{white-space:normal}
  .rtable.kvm tr{grid-template-columns:minmax(0,1fr)}
  .rtable.kvm td[data-l]{display:flex;justify-content:space-between;gap:8px}
}
@media (min-width:769px){ .only-m{display:none!important} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Derived ================= */
const commissionOf = p => p.islem==='Kiralık' ? p.price * p.sides : p.price * 0.02 * p.sides;
const expectedComm = () => PORTFOLIOS.reduce((s,p)=> s + commissionOf(p) * STAGES[stageIdx(p.stage)].p, 0);
const TARGET = 1000000, REALIZED = 780000;

function matchScore(c, p){
  if (c.tip==='Satıcı' || c.islem!==p.islem) return null;
  let s = 0; const r = [];
  if (p.price>=c.min && p.price<=c.max){ s+=35; r.push(['ok','Bütçe içinde']); }
  else if (p.price>c.max && p.price<=c.max*1.1){ s+=20; r.push(['warn',`Bütçenin %${Math.round((p.price/c.max-1)*100)} üzerinde`]); }
  else if (p.price<c.min){ s+=22; r.push(['info','Bütçenin altında']); }
  else r.push(['err','Bütçe dışı']);
  if (c.bolge.includes(p.mah)){ s+=30; r.push(['ok',p.mah]); }
  else if (CLIENTS && PORTFOLIOS.some(x=>c.bolge.includes(x.mah) && x.ilce===p.ilce)){ s+=12; r.push(['warn',`${p.ilce} (tercih dışı mahalle)`]); }
  else r.push(['err','Bölge dışı']);
  if (c.oda.includes(p.oda)){ s+=20; r.push(['ok',p.oda]); } else { s+=4; r.push(['err',`${p.oda} (istenen ${c.oda.join('/')})`]); }
  if (c.krediNeed){ if (p.tapu.kredi){ s+=10; r.push(['ok','Krediye uygun']); } else r.push(['err','Krediye uygun değil']); }
  else { s+=10; }
  if (['yayinda','teklif'].includes(p.stage)) s+=5; else r.push(['info','Henüz yayında değil']);
  return {s:Math.min(99,s), r};
}
const matchesFor = c => PORTFOLIOS.map(p=>({p,m:matchScore(c,p)})).filter(x=>x.m && x.m.s>=40).sort((a,b)=>b.m.s-a.m.s);

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function toast(msg, icon='check'){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=ic(icon)+`<span>${msg}</span>`; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3200); }
function badge(kind, text, icon){ return `<span class="badge ${kind}">${icon?ic(icon):''}${text}</span>`; }
function ph(hue, cap='', tag=''){ const [a,b]=HUES[hue%HUES.length]; return `<div class="ph" style="--h1:${a};--h2:${b}"><svg viewBox="0 0 24 24">${ICONS.logo}</svg>${cap?`<span class="cap">${cap}</span>`:''}${tag?`<span class="tag">${tag}</span>`:''}</div>`; }
function ring(v, size=84){ const r=36, c=2*Math.PI*r, col = v>=75?'var(--ok)':v>=50?'var(--warn)':'var(--err)';
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}"/></svg><div class="v"><div>${v}<small>/100</small></div></div></div>`; }
function stageBadge(k){ const m={aday:'',degerleme:'',yetki:'info',yayinda:'ok',teklif:'brand',kapora:'brand',tapu:'warn'}; return badge(m[k]||'',`<span class="sdot"></span>${stageName(k)}`); }
function eidsBadge(e){ return e==='ok'?badge('ok','EİDS','check'):e==='pending'?badge('warn','EİDS bekliyor','clock'):badge('err','EİDS yok','x'); }
function yetkiBadge(y){ return !y.ok?badge('err','Yetki yok','x'):y.kalan<=7?badge('warn',`Yetki ${y.kalan} gün`,'hourglass'):badge('ok',`Yetki ${y.kalan} gün`,'check'); }
function heatBar(h){ const k=h>=70?'err':h>=45?'warn':''; return `<div class="heat"><span style="color:${h>=70?'var(--err)':h>=45?'var(--warn)':'var(--muted)'}">${ic('flame')}</span><div class="progress ${k}"><span style="width:${h}%;${k?'':'background:var(--muted)'}"></span></div><b class="num small">${h}</b></div>`; }
function priceLabel(p){ return p.islem==='Kiralık' ? `${tl(p.price)}<span class="muted small" style="font-weight:500"> /ay</span>` : tl(p.price); }
const scoreCls = s => s>=75?'hi':s>=60?'md':'lo';

/* ---- 6. İşlemler (Kanban) ---- */
V.islemler = () => `
  <div class="page-head"><div><h1>İşlemler</h1><p>Sürükle-bırak ile aşama değiştirin · her geçişte Uyum Motoru çalışır</p></div>
    <div class="row wrap small">${badge('err','ENGELLE','x')}${badge('warn','UYAR','alert')}${badge('ok','GEÇ','check')}</div></div>
  <div class="board" id="board">${STAGES.map(s=>{ const items=PORTFOLIOS.filter(p=>p.stage===s.k); const e=items.reduce((a,p)=>a+commissionOf(p)*s.p,0);
    return `<div class="col" data-stage="${s.k}"><div class="col-h"><b>${s.t} <span class="n">(${items.length})</span></b><span class="xs muted num" data-tip="Beklenen komisyon (olasılık %${Math.round(s.p*100)})">${mTL(e)}</span></div>
    <div class="col-b">${items.map(kcard).join('')||'<div class="xs muted" style="text-align:center;padding:20px 0">Buraya sürükleyin</div>'}</div></div>`; }).join('')}</div>
  <p class="xs muted">Kural seti v2026.09 · "Yayında" ve sonrası: Yetki sözleşmesi + EİDS zorunlu · "Tapu": DASK zorunlu. Mobilde kartlara dokunarak aşama seçebilirsiniz.</p>`;
function kcard(p){ return `<div class="kcard" draggable="true" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}"><div class="bold small">${p.title}</div><div class="row between"><span class="num small bold">${p.islem==='Kiralık'?tl(p.price)+'/ay':mTL(p.price)}</span><span class="xs muted">${p.id}</span></div><div class="flags">${yetkiBadge(p.yetki)}${eidsBadge(p.eids)}</div></div>`; }
MOUNT.islemler = () => {
  const board = $('#board');
  board.addEventListener('dragstart', e=>{ const c=e.target.closest('.kcard'); if(!c) return; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed='move'; });
  board.addEventListener('dragend', e=>{ const c=e.target.closest('.kcard'); if(c) c.classList.remove('dragging'); $$('.col.over').forEach(x=>x.classList.remove('over')); });
  $$('.col',board).forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('over'); tryMove(e.dataTransfer.getData('text/plain'), col.dataset.stage); });
  });
  board.addEventListener('click', e=>{ const c=e.target.closest('.kcard'); if(c) openDeal(c.dataset.id); });
  board.addEventListener('keydown', e=>{ const c=e.target.closest('.kcard'); if(c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDeal(c.dataset.id);} });
};
function openDeal(id){
  const p=P(id);
  openSheet(p.title, `<div style="height:140px">${ph(p.hue)}</div>
    <div class="row between"><span class="price num">${priceLabel(p)}</span>${stageBadge(p.stage)}</div>
    <div class="row wrap" style="gap:4px">${yetkiBadge(p.yetki)}${eidsBadge(p.eids)}${p.dask!=='—'?badge('ok','DASK'):badge('err','DASK yok')}</div>
    <div class="lbl">Aşamaya taşı</div>
    <div class="chips">${STAGES.map(s=>`<button class="chip ${s.k===p.stage?'on':''}" data-act="move" data-id="${p.id}" data-stage="${s.k}">${s.t}</button>`).join('')}</div>
    <p class="small muted">Beklenen komisyon: <b class="num">${tl(commissionOf(p)*STAGES[stageIdx(p.stage)].p)}</b> (olasılık %${Math.round(STAGES[stageIdx(p.stage)].p*100)})</p>`,
    `<a class="btn" href="#/portfoy/${p.id}">Portföy kartı</a>`);
}
function tryMove(id, to){
  const p=P(id); if(!p||p.stage===to) return;
  const need=[];
  if (stageIdx(to)>=stageIdx('yayinda')){
    if(!p.yetki.ok) need.push({k:'yetki',t:'Yazılı yetki sözleşmesi yok',d:'Taşınmaz Ticareti Yönetmeliği: mal sahibiyle yazılı yetki sözleşmesi olmadan ilan/pazarlama yapılamaz.',fix:'Yetkiyi OTP ile imzaya gönder'});
    if(p.eids!=='ok') need.push({k:'eids',t: p.eids==='pending'?'EİDS: malik e-Devlet onayı bekleniyor':'EİDS yetkilendirme talebi yapılmamış',d:'İlan yayımlanmadan önce malik/yetki ilişkisi e-Devlet üzerinden doğrulanmalı.',fix:'Malike EİDS yönlendirmesi gönder'});
  }
  if (need.length){
    closeAll();
    openModal(`${ic('shield')} Uyum Motoru — İşlem engellendi`, `
      <div class="alert err">${ic('x')}<div class="body"><b>ENGELLE:</b> "${p.title}" → <b>${stageName(to)}</b> geçişi için ${need.length} zorunlu adım eksik.</div></div>
      ${need.map(n=>`<div class="card card-b"><div class="bold">${n.t}</div><p class="small muted" style="margin:4px 0 10px">${n.d}</p><div class="row wrap"><button class="btn sm primary" data-act="fix" data-k="${n.k}" data-id="${p.id}">${ic('send')}${n.fix}</button><button class="btn sm ghost" data-act="fixsim" data-k="${n.k}" data-id="${p.id}">Prototip: tamamlandı say</button></div></div>`).join('')}
      <p class="xs muted">Kural: TTY-İLAN-01 · EİDS-02 · kural seti v2026.09. Engellenen deneme denetim kaydına yazıldı.</p>`,
      `<button class="btn" data-act="close">Kapat</button><button class="btn primary" data-act="retry" data-id="${p.id}" data-stage="${to}">Tekrar dene</button>`);
    return;
  }
  if (to==='tapu' && p.dask==='—'){
    openModal('Uyum Motoru — Uyarı', `<div class="alert warn">${ic('alert')}<div class="body"><b>UYAR:</b> DASK poliçesi yok. Tapu işlemi için zorunludur.</div></div>`, `<button class="btn" data-act="close">Vazgeç</button><button class="btn primary" data-act="forcemove" data-id="${p.id}" data-stage="${to}">Gerekçe ile devam et</button>`);
    return;
  }
  doMove(p,to);
}
function doMove(p,to){ p.stage=to; closeAll(); if(route().name==='islemler') render(); toast(`${p.id} → ${stageName(to)} · GEÇ · kural v2026.09 kayda eklendi`); }

      <section class="card card-b"><h2>Güvenlik</h2><p class="small t2" style="margin:6px 0 12px">Tek başına gösterimde "Güvendeyim" check-in; süre aşılırsa takım liderine alarm.</p><button class="btn block" data-act="toast" data-msg="Güvendeyim check-in: 45 dk sayaç başladı">${ic('shield')}Güvendeyim check-in</button></section>
      <section class="card card-b"><h2>Anahtarlar</h2><div class="row between small" style="margin-top:8px"><span>Moda 3+1</span>${badge('ok','Ofis kasası')}</div><div class="row between small" style="margin-top:6px"><span>Barbaros 3+1</span>${badge('info','Emrullah K.')}</div></section>
    </aside></div>`;
};
function apptCard(s){

  const done = s.durum==='tamamlandi';
  return `<div class="appt" id="appt-${s.id}"><div class="tm num">${s.saat}<small>${s.sure}</small></div><div class="card card-b stack" style="--c:${col};gap:10px">
    <div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="xs bold" style="color:${col};text-transform:uppercase;letter-spacing:.04em">${s.tur}</div><a class="bold" href="#/portfoy/${p.id}" style="color:inherit">${p.title}</a><div class="small muted">${c?c.name:s.kisi} · ${p.ilce}/${p.mah}</div></div>${done?badge('ok','Tamamlandı','check'):badge('','Planlı')}</div>

/* ---- 10. Raporlar ---- */
function barChart(data, {W=640, h=240, fmt=v=>v, unit=''}={}){
  const pad={l:44,r:8,t:12,b:26}, iw=W-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d[1]))*1.1, step=niceStep(max), top=Math.ceil(max/step)*step;
  const bw=iw/data.length, gap=Math.max(2,bw*.28);
  let g=''; for(let v=0; v<=top; v+=step){ const y=pad.t+ih-(v/top)*ih; g+=`<line class="gl" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/><text class="ax" x="${pad.l-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; }
  const bars=data.map(([l,v],i)=>{ const x=pad.l+i*bw+gap/2, w=bw-gap, bh=(v/top)*ih, y=pad.t+ih-bh; const last=i===data.length-1;
    return `<path class="bar ${last?'':''}" d="${roundTop(x,y,w,bh,4)}" data-tip="${l}: ${unit==='₺'?tl(v*1000):v}"/>${bw>=34||i%2===1?`<text class="ax" x="${x+w/2}" y="${h-8}" text-anchor="middle">${l}</text>`:''}`; }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}${bars}</svg>`;
}
function hbarChart(data,{W=460, fmt=v=>v, labelW=110, rowH=32, showPct=false}={}){
  const max=Math.max(...data.map(d=>d[1])), iw=W-labelW-70, h=data.length*rowH+4;
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${data.map(([l,v],i)=>{ const y=i*rowH+4, w=Math.max(3,v/max*iw);
    const p = showPct && i>0 ? ` · %${Math.round(v/data[i-1][1]*100)}` : '';
    return `<text class="lb" x="${labelW-10}" y="${y+rowH/2+2}" text-anchor="end">${l}</text><path class="bar" d="${roundRight(labelW,y+5,w,rowH-12,4)}" data-tip="${l}: ${fmt(v)}${p?` (önceki adımın ${p.replace(' · ','')}'i)`:''}"/><text class="lb num" x="${labelW+w+6}" y="${y+rowH/2+2}">${fmt(v)}${p}</text>`; }).join('')}</svg>`;
}
function niceStep(max){ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function roundTop(x,y,w,h,r){ r=Math.min(r,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function roundRight(x,y,w,h,r){ r=Math.min(r,h/2,w); return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`; }
const REV = [['Eki',410],['Kas',520],['Ara',380],['Oca',290],['Şub',450],['Mar',610],['Nis',700],['May',820],['Haz',560],['Tem',640],['Ağu',590],['Eyl',780]];

  form: el => openForm(el.dataset.f),
  formok: el => { closeAll(); toast(`${el.dataset.n} kaydedildi (prototip)`); },
  voice: () => { openModal('Sesle not', `<div class="rec">${ic('mic')}</div><p style="text-align:center" class="t2" id="recT">Dinleniyor… <b class="num" id="recS">0:00</b></p><div id="recOut"></div>`, `<button class="btn" data-act="close">Vazgeç</button><button class="btn primary" data-act="voicestop" id="vStop">Bitir ve özetle</button>`);
    let s=0; clearInterval(window._rec); window._rec=setInterval(()=>{ s++; const el=$('#recS'); if(el) el.textContent=`0:${String(s).padStart(2,'0')}`; if(s>=30) clearInterval(window._rec); },1000); },
  voicestop: () => { clearInterval(window._rec); $('.rec').style.animation='none'; $('.rec').style.background='var(--ok)'; $('#recT').innerHTML='<b>AI özeti</b> <span class="badge info">Yapay Zekâ modülü kapalı — örnek çıktı</span>';
    $('#recOut').innerHTML = `<div class="script">"Zeynep Hanım Moda dairesini beğendi, eşi de görmek istiyor. Fiyatta %3 pazarlık bekliyor."</div><div class="li" style="padding:10px 0;border:0"><span class="ic brand">${ic('clock')}</span><div class="grow"><div class="t">Görev: Salı 14:00 tekrar ara</div><div class="s">Zeynep Aydın · eşiyle ikinci gösterim</div></div></div>`;
    $('#vStop').outerHTML = `<button class="btn primary" data-act="formok" data-n="Not ve görev">Kaydet</button>`; },
  photo: () => { closeAll(); toast('Kamera açıldı (prototip) · fotoğraflar portföye eklenecek','camera'); }
};
function openForm(k){
  const F = {
    portfoy:['Yeni portföy',[['Başlık','Moda 2+1, bahçe katı'],['Satış / kira bedeli (₺)','8.500.000'],['İlçe / mahalle','Kadıköy / Moda'],['Mal sahibi','Ad Soyad'],['Mal sahibi telefonu','05xx xxx xx xx']],'Portföy "Aday" aşamasında oluşturulur. Yayın için yetki sözleşmesi ve EİDS gerekir.'],
    musteri:['Yeni müşteri',[['Ad soyad','Ad Soyad'],['Telefon','05xx xxx xx xx'],['Tip','Alıcı'],['Bütçe','8–10 M ₺'],['Sonraki adım (zorunlu)','Yarın 11:00 ara']],'KVKK aydınlatma metni SMS ile otomatik gönderilir.'],
    gosterim:['Yeni gösterim',[['Portföy','Moda Mah. 3+1'],['Müşteri','Zeynep Aydın'],['Tarih / saat','25.09.2026 11:00']],'Yer Gösterme Belgesi taslağı otomatik hazırlanır.']
  }[k]; if(!F) return;
  openSheet(F[0], F[1].map(([l,ph_],i)=>`<div class="field"><label for="ff${i}">${l}</label><input class="input" id="ff${i}" placeholder="${ph_}"></div>`).join('')+`<p class="xs muted">${F[2]}</p>`, `<button class="btn" data-act="close">Vazgeç</button><button class="btn primary" data-act="formok" data-n="${F[0].replace('Yeni ','').replace(/^./,c=>c.toLocaleUpperCase('tr'))}">Kaydet</button>`);
}
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { if(a.tagName==='BUTTON'||a.dataset.act==='dial'||a.dataset.act==='otpfill') e.preventDefault(); ACT[a.dataset.act](a,e); return; }
  const h = e.target.closest('[data-href]');
  if (h && !e.target.closest('a,button,input,label')) { location.hash = h.dataset.href; return; }
  if (e.target.classList.contains('overlay')) closeAll();
});
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); }
  else if (e.key==='Escape') { clearInterval(window._rec); closeAll(); }
  else if (e.key==='Enter' && e.target.matches('[data-href]')) location.hash = e.target.dataset.href;
  else if (e.key==='Enter' && e.target.id==='msgIn') $('[data-act=sendmsg]').click();
});

/* ================= Tooltip ================= */
document.addEventListener('mouseover', e=>{ const t=e.target.closest('[data-tip]'); const tip=$('#tip'); if(!t){ tip.classList.remove('on'); return; } tip.textContent=t.dataset.tip; tip.classList.add('on'); });
document.addEventListener('mousemove', e=>{ const tip=$('#tip'); if(!tip.classList.contains('on')) return; const x=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8); tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px'; });

/* ================= Command palette ================= */
let cmdSel = 0, cmdItems = [];
function openCmdk(){ closeAll(); lastFocus=document.activeElement; $('#cmdkOv').classList.add('on'); const i=$('#cmdkIn'); i.value=''; cmdSearch(''); setTimeout(()=>i.focus(),30); }
function cmdSearch(q){
  const n=norm(q.trim()), digits=q.replace(/\D/g,'');
  const hit = s => !n || norm(s).includes(n) || (digits.length>=3 && s.replace(/\D/g,'').includes(digits));
  const groups = [
    ['Ekranlar', NAV.flatMap(g=>g[1]).filter(([k,t])=>hit(t)).map(([k,t,i])=>({i,t,s:'Git',h:'#/'+k}))],
    ['Portföyler', PORTFOLIOS.filter(p=>hit(`${p.title} ${p.id} ${p.mah} ${p.ilce} ada ${p.tapu.ada}/${p.tapu.parsel} ${p.owner}`)).map(p=>({i:'building',t:p.title,s:`${p.id} · ${p.islem==='Kiralık'?tl(p.price)+'/ay':mTL(p.price)} · ${p.tapu.ada}/${p.tapu.parsel}`,h:'#/portfoy/'+p.id}))],
    ['Müşteriler', CLIENTS.filter(c=>hit(`${c.name} ${c.tel} ${c.bolge.join(' ')} ${c.tip}`)).map(c=>({i:'users',t:c.name,s:`${c.tip} · ${c.tel}`,h:'#/musteri/'+c.id}))],
    ['FSBO ilanları', FSBO.filter(f=>hit(`${f.ilan} ${f.owner} ${f.mah}`)).map(f=>({i:'radar',t:f.ilan,s:`Skor ${f.skor} · ${f.owner}`,act:()=>{ location.hash='#/radar'; setTimeout(()=>openCall(f.id),50); }}))]
  ].map(([g,items])=>[g, n?items.slice(0,6):items.slice(0,4)]).filter(g=>g[1].length);
  cmdItems = groups.flatMap(g=>g[1]); cmdSel = 0; let idx=0;
  $('#cmdkRes').innerHTML = groups.length ? groups.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(it=>`<div class="it ${idx===0?'sel':''}" data-i="${idx++}" role="option">${ic(it.i)}<span class="ellipsis">${esc(it.t)}</span><span class="s">${esc(it.s)}</span></div>`).join('')).join('') : `<div class="muted" style="padding:24px;text-align:center">"${esc(q)}" için sonuç yok</div>`;
}
function cmdGo(i){ const it=cmdItems[i]; if(!it) return; $('#cmdkOv').classList.remove('on'); if(it.act) it.act(); else location.hash=it.h; }
$('#cmdkIn').addEventListener('input', e=>cmdSearch(e.target.value));
$('#cmdkIn').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); cmdSel=(cmdSel+(e.key==='ArrowDown'?1:-1)+cmdItems.length)%cmdItems.length; $$('#cmdkRes .it').forEach(x=>x.classList.toggle('sel',+x.dataset.i===cmdSel)); const s=$('#cmdkRes .it.sel'); if(s) s.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); cmdGo(cmdSel); }
});
$('#cmdkRes').addEventListener('click', e=>{ const it=e.target.closest('.it'); if(it) cmdGo(+it.dataset.i); });

/* ================= Theme ================= */
function storedTheme(){ try { return localStorage.getItem('dc-theme'); } catch(_) { return null; } }
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem('dc-theme',t); }catch(_){} paintThemeBtn(); const sw=$('#darkSw'); if(sw) sw.setAttribute('aria-checked', isDark()); }
function paintThemeBtn(){ $('#themeBtn').innerHTML = ic(isDark()?'sun':'moon'); }

/* ================= Boot ================= */
(function boot(){
  const t=storedTheme(); if(t) document.documentElement.dataset.theme=t;
  $('#logoMark').innerHTML = $('#logoMark2').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS.logo}</svg>`;
  hydrateIcons(); renderNav(); paintThemeBtn();
  prevRoute = route().name; render();
})();
</script>
</body>
</html>
