name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Uygulama (lint, tip, test, derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:templates
      - run: npm run build
        env:
          # Derleme demo modunda doğrulanır; gerçek anahtarlar Vercel'de tanımlanır
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: Veritabanı migration doğrulaması
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci
    steps:
      - uses: actions/checkout@v4
      - name: Supabase taklidi (auth, storage, roller)
        run: psql -q -v ON_ERROR_STOP=1 -f .github/workflows/ci-supabase-stub.sql
      - name: Migration dosyalarını sırayla uygula
        run: |
          set -euo pipefail
          for f in $(ls app/supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql -q -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: Duman testi (ofis kurulumu, davet, RLS)
        run: psql -q -v ON_ERROR_STOP=1 -f .github/workflows/ci-supabase-smoke.sql
